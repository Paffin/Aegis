# Squid: allow AI endpoints only from the Aegis gateway hosts; everybody else is refused.
# Include from squid.conf. ai-domains.txt uses leading-dot suffix form here (generate it with
#   sed -E '/^#|^$/d; s/^\*\./\./; s/^([^.])/.\1/' ai-domains.txt > /etc/squid/ai-domains.acl ).
acl aegis_gateway src 10.0.10.11 10.0.10.12          # <- your gateway addresses
acl ai_services dstdomain "/etc/squid/ai-domains.acl"

http_access allow aegis_gateway ai_services
http_access deny ai_services
# Tell the user why, instead of a silent failure:
deny_info ERR_AEGIS_REQUIRED ai_services
