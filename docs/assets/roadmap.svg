<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="404" viewBox="0 0 1040 404" role="img" aria-label="Этапы проекта">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker></defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, "DejaVu Sans", Arial, sans-serif; fill: #cbd5e1; font-size: 15px; }
.h { font-size: 22px; font-weight: 700; fill: #f1f5f9; }
.t { font-size: 17px; font-weight: 700; fill: #f1f5f9; }
.s { font-size: 14px; fill: #94a3b8; }
.n { font-size: 40px; font-weight: 800; fill: #f1f5f9; }
.m { font-family: "SFMono-Regular", Consolas, "DejaVu Sans Mono", monospace; font-size: 13.5px; fill: #cbd5e1; }
.b { font-weight: 700; }
</style>
<rect width="1040" height="404" rx="18" fill="#0b1220"/>
<text x="32" y="44" class="h">Где проект сейчас</text>
<text x="32" y="66" class="s">Версия 0.1, альфа. Доля — по требованиям спецификации, у которых есть тесты</text>
<rect x="28" y="90" width="236" height="286" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text x="46" y="124" class="t">Этап 0</text>
<text x="46" y="146" class="s">стенд измерений</text>
<rect x="46" y="168" width="200" height="12" rx="6" fill="#1e293b"/>
<rect x="46" y="168" width="120" height="12" rx="6" fill="#fcd34d"/>
<text x="46" y="206" style="font-size:26px;font-weight:800;fill:#f1f5f9">3 из 5</text>
<text x="46" y="240" class="s">требований с тестами</text>
<text x="46" y="270">корпуса, фаззер, нагрузка</text>
<text x="46" y="340" class="s">бенчмарк агентов и</text>
<text x="46" y="358" class="s">записанные сессии в работе</text>
<rect x="276" y="90" width="236" height="286" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text x="294" y="124" class="t">Этап 1</text>
<text x="294" y="146" class="s">LLM Gateway</text>
<rect x="294" y="168" width="200" height="12" rx="6" fill="#1e293b"/>
<rect x="294" y="168" width="195" height="12" rx="6" fill="#86efac"/>
<text x="294" y="206" style="font-size:26px;font-weight:800;fill:#f1f5f9">133 из 136</text>
<text x="294" y="240" class="s">требований с тестами</text>
<text x="294" y="270">протоколы, псевдонимы,</text>
<text x="294" y="290">подстановка, аудит</text>
<text x="294" y="340" class="s">ждут пилот, пентест, кластер</text>
<rect x="524" y="90" width="236" height="286" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text x="542" y="124" class="t">Этап 2</text>
<text x="542" y="146" class="s">агенты и код</text>
<rect x="542" y="168" width="200" height="12" rx="6" fill="#1e293b"/>
<rect x="542" y="168" width="190" height="12" rx="6" fill="#86efac"/>
<text x="542" y="206" style="font-size:26px;font-weight:800;fill:#f1f5f9">20 из 21</text>
<text x="542" y="240" class="s">требований с тестами</text>
<text x="542" y="270">Agent Guard, MCP, индекс</text>
<text x="542" y="290">кода, OIDC, ключи из</text>
<text x="542" y="310">хранилища</text>
<text x="542" y="340" class="s">Bedrock и Vertex сняты по</text>
<text x="542" y="358" class="s">решению заказчика</text>
<rect x="772" y="90" width="236" height="286" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
<text x="790" y="124" class="t">Этап 3</text>
<text x="790" y="146" class="s">платформа</text>
<rect x="790" y="168" width="200" height="12" rx="6" fill="#1e293b"/>
<text x="790" y="206" style="font-size:26px;font-weight:800;fill:#f1f5f9">0 из 12</text>
<text x="790" y="240" class="s">требований с тестами</text>
<text x="790" y="270">NER, OCR,</text>
<text x="790" y="290">мультитенантность, консоль</text>
<text x="790" y="340" class="s">не начато</text>
</svg>
