# Цепочка поставки (SEC-09). Проверка: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
# уязвимости и снятые с поддержки пакеты — ошибка
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# не тянуть вторую TLS-реализацию в gateway: только rustls
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
