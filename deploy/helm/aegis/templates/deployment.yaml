apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.name" . }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aegis.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "aegis.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Active streams may finish for up to 10 minutes on shutdown (NFR-06).
      terminationGracePeriodSeconds: 620
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/etc/aegis/gateway.json"]
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/aegis, readOnly: true }
            - { name: state, mountPath: /var/lib/aegis }
            - { name: logs, mountPath: /var/log/aegis }
      volumes:
        - name: config
          configMap: { name: {{ include "aegis.name" . }}-config }
        # in memory: bundle cache and audit survive a container restart but not a node loss
        - name: state
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: logs
          emptyDir: { sizeLimit: 1Gi }
