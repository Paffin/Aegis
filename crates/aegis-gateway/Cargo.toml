[package]
name = "aegis-gateway"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[dependencies]
aegis-core.workspace = true
aegis-hsm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
axum.workspace = true
