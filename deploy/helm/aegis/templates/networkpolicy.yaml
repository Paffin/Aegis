apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aegis.name" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.allowedClientNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . | quote }} } }
        {{- end }}
      ports: [{ port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- range .Values.egressCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ port: 443 }]
    {{- end }}
