name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64, aegis]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: actions/cache@v4
        with:
          path: ~/kryoptic
          key: kryoptic-${{ hashFiles('scripts/build-kryoptic.sh') }}
      - name: Real PKCS#11 tokens for the HSM tests (CFG-07)
        # NSS softoken from the distribution, and kryoptic (a token written in Rust) built from a
        # pinned source; the build is cached by the hash of its script
        run: |
          sudo apt-get install -y -qq libnss3
          echo "AEGIS_TEST_KRYOPTIC=$(scripts/build-kryoptic.sh "$HOME/kryoptic" | tail -1)" >> "$GITHUB_ENV"
          echo "AEGIS_REQUIRE_TOKEN=1" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Keys in an HSM, against the real tokens (CFG-07)
        run: cargo test -p aegis-hsm --test token -- --test-threads=4
      - name: Trace requirements
        run: scripts/trace.sh
      - name: Documents say what the requirements demand
        run: scripts/docs-check.sh
      - name: Smoke test with real binaries
        run: scripts/smoke.sh
      - name: Detection quality gates (QA-05)
        run: |
          cargo run -q --release -p aegis-bench -- recall --n 1000 --min-recall 98
          cargo run -q --release -p aegis-bench -- fp --dir "$HOME/.cargo/registry/src" --samples 0 --max-per-10k 8
          # QA-10: fragments of an indexed repository are recognized, foreign code is not
          T=$(ls -d "$HOME"/.cargo/registry/src/*/tokio-1.* | head -1)
          NEG=$(for d in "$HOME"/.cargo/registry/src/*/*/; do echo "--negative $d"; done)
          cargo run -q --release -p aegis-bench -- code --closed "$T" $NEG --min-recall 95 --max-false 0.1
          cargo run -q --release -p aegis-bench -- perf --dir "$HOME/.cargo/registry/src" --kb 800 --iterations 15 --max-warm-p95-ms 50
      - name: Agent Guard decides within 20 ms (AGG-07)
        run: cargo test -q --release -p aegis-guard --test guard a_decision_takes_milliseconds
      - name: Demo (README walkthrough keeps working)
        run: scripts/demo.sh
      - name: Load test (NFR-03, NFR-04)
        run: cargo run -q --release -p aegis-bench -- load --dir "$HOME/.cargo/registry/src" --seconds 10 --stream-secs 8 --max-ttfb-overhead-p95-ms 100 --min-streams 200
  supply-chain:
    # SEC-09: licenses, bans, advisories and sources; a CycloneDX SBOM of the workspace
    runs-on: [self-hosted, Linux, ARM64, aegis]
    steps:
      - uses: actions/checkout@v4
      # prebuilt binaries: the runner has no Docker daemon, so the Docker-based cargo-deny action cannot run
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit
      - uses: dtolnay/rust-toolchain@stable
      - name: SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
  image:
    # needs a Docker daemon (and helm) on the runner; set the repository variable AEGIS_RUNNER_DOCKER=true
    # after mounting /var/run/docker.sock into the runner container
    if: vars.AEGIS_RUNNER_DOCKER == 'true'
    runs-on: [self-hosted, Linux, ARM64, aegis]
    steps:
      - uses: actions/checkout@v4
      - name: Helm chart renders
        run: |
          helm lint deploy/helm/aegis --set config.bundle.source=https://example/bundle.json --set 'config.bundle.trustedKeys={00}'
          helm template aegis deploy/helm/aegis --set config.bundle.source=https://example/bundle.json --set 'config.bundle.trustedKeys={00}' > /dev/null
      - name: Build the image
        run: docker build -t aegis:ci .
      - name: The image starts read-only, as non-root, and answers
        run: |
          mkdir -p "$RUNNER_TEMP/cfg"
          HASH=$(printf %s aegis-vk-ci | sha256sum | cut -d' ' -f1)
          printf '{"listen":"127.0.0.1:18080","admin_listen":"127.0.0.1:19090","anthropic_base_url":"http://127.0.0.1:1","virtual_keys":[{"sha256":"%s","principal":"u:ci"}]}' "$HASH" > "$RUNNER_TEMP/cfg/gateway.json"
          docker run -d --name aegis --network host --read-only --cap-drop ALL --security-opt no-new-privileges             -v "$RUNNER_TEMP/cfg:/etc/aegis:ro" -e AEGIS_K_TENANT=0123456789abcdef0123456789abcdef             -e AEGIS_K_AUDIT=fedcba9876543210fedcba9876543210 -e AEGIS_ANTHROPIC_KEY=x aegis:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19090/readyz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:19090/readyz
          test "$(docker inspect aegis --format '{{.Config.User}}')" = nonroot
  clients:
    runs-on: [self-hosted, Linux, ARM64, aegis]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real clients against Aegis and a mock provider
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install uv
          scripts/clients.sh
      - name: Managed settings of Claude Code, needs root for /etc/claude-code
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" scripts/client-claude-managed.sh
      - name: Agent benchmark tasks (each fails before and passes after a reference fix)
        run: python3 scripts/agent_bench.py --selftest
