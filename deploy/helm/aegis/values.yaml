image:
  repository: ghcr.io/paffin/aegis
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

replicaCount: 2

# Gateway configuration written to /etc/aegis/gateway.json (see docs/ADMIN.md).
config:
  anthropicBaseUrl: https://api.anthropic.com   # "" to disable /v1/messages
  anthropicAuth: ""        # x-api-key (default) or bearer
  openaiBaseUrl: ""        # set to enable /v1/chat/completions, /v1/responses, /v1/completions, /v1/embeddings
  openaiApiPrefix: ""      # default /v1; /v4 for Zhipu (https://open.bigmodel.cn/api/paas), /api/v3 for Volcengine
  openaiAuth: ""           # bearer (default), api-key (Azure) or none (local models)
  geminiBaseUrl: ""        # set to enable /v1beta/models/*:generateContent
  tenant: default
  auditPath: /var/log/aegis/audit.jsonl
  auditRequired: false
  bundle:
    source: ""             # path or https URL of the signed bundle
    trustedKeys: []        # hex ed25519 public keys allowed to sign bundles
    reloadSeconds: 15

# Secrets are taken from an existing Secret (never from values).
# Required keys: AEGIS_K_TENANT, AEGIS_K_AUDIT, and one key per configured provider:
# AEGIS_ANTHROPIC_KEY, AEGIS_OPENAI_KEY (not with openaiAuth: none), AEGIS_GEMINI_KEY.
existingSecret: aegis-secrets

service:
  port: 8080

# Which namespaces may call the gateway (NetworkPolicy).
allowedClientNamespaces: []

# Egress: only DNS and the providers' address ranges. Fill in your provider endpoints or proxy.
egressCidrs: []

resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { memory: 2Gi }

podDisruptionBudget:
  minAvailable: 1
